swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: '1.1.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      operationId: userLogin
      tags:
        - User Module
      summary: Login
      description: >
        This endpoint allows users to log in by providing their email and password.
        If the credentials are valid, a JWT token is returned, which can be used
        for authenticated requests. If the credentials are invalid, a 400 error
        is returned with an appropriate error message.
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/signup:
    post:
      operationId: userSignup
      tags:
        - User Module
      summary: Signup
      description: >
        This endpoint allows new users to sign up by providing their email, password,
        first name, and last name. If the signup is successful, a confirmation message
        is returned. If the provided data is invalid, a 400 error is returned.
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/profile:
    post:
      operationId: getUserProfile
      security:
        - Bearer: []
      tags:
        - User Module
      summary: Fetch User Profile
      description: >
        This endpoint retrieves the profile information of the authenticated user.
        A valid JWT token must be provided in the Authorization header.
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successfully
          schema:
            $ref: '#/definitions/ApiResponse'            
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    put:
      operationId: updateUserProfile
      security:
        - Bearer: []
      tags:
        - User Module
      summary: Update User Profile
      description: >
        This endpoint allows the authenticated user to update their profile information,
        such as first name and last name. A valid JWT token must be provided in the
        Authorization header.
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: User profile updated successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    delete:
      operationId: deleteUserProfile
      security:
        - Bearer: []
      tags:
        - User Module
      summary: Delete User Profile
      description: >
        This endpoint allows the authenticated user to delete their profile. A valid
        JWT token must be provided in the Authorization header.
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: User profile deleted successfully
          schema:
            $ref: '#/definitions/ApiResponse'             
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/accounts:
    get:
      operationId: getAccountsByUser
      security:
        - Bearer: []
      tags:
        - Accounts Module
      summary: Fetch User Accounts
      description: >
        This endpoint retrieves all accounts associated with the authenticated user.
        A valid JWT token must be provided in the Authorization header.
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: User accounts retrieved successfully
          schema:
            $ref: '#/definitions/AccountsResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/accounts/{accountId}/transactions:
    get:
      operationId: getTransactionsByAccount
      security:
        - Bearer: []
      tags:
        - Accounts Module
      summary: Fetch Transactions for a Specific Account
      description: >
        Retrieves all transactions linked to the specified account. Optionally,
        transactions can be filtered by month and year using the `month` and `year`
        query parameters. If no filters are provided, all transactions for the account
        are returned.
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
        - in: path
          name: accountId
          description: The unique ID of the account
          required: true
          type: string
        - in: query
          name: month
          description: The month for which to fetch transactions (1-12)
          required: false
          type: integer
          minimum: 1
          maximum: 12
        - in: query
          name: year
          description: The year for which to fetch transactions (e.g., 2025)
          required: false
          type: integer
      produces:
        - application/json
      responses:
        '200':
          description: Transactions successfully retrieved
          schema:
            $ref: '#/definitions/TransactionsResponse'
        '400':
          description: Invalid Request
        '404':
          description: Account Not Found
        '500':
          description: Internal Server Error
  /user/accounts/{accountId}/transactions/{transactionId}:
    patch:
      operationId: updateTransactionDetails
      security:
        - Bearer: []
      tags:
        - Accounts Module
      summary: Update Transaction Details
      description: >
        Allows updating specific fields (e.g., `category` and `notes`) of a transaction
        linked to the specified account. Only the fields provided in the request body
        are updated. A valid JWT token must be provided in the Authorization header.
      parameters:
        - in: header
          name: Authorization
          description: Attach Bearer JWT token
          required: true
          type: string
        - in: path
          name: accountId
          description: The unique ID of the account
          required: true
          type: string
        - in: path
          name: transactionId
          description: The unique ID of the transaction
          required: true
          type: string
        - in: body
          name: body
          description: Fields to update
          required: false
          schema:
            $ref: '#/definitions/UpdateTransaction'
      produces:
        - application/json
      responses:
        '200':
          description: Transaction details updated successfully
          schema:
            $ref: '#/definitions/TransactionUpdateResponse'
        '400':
          description: Invalid Request
        '404':
          description: Transaction Not Found
        '500':
          description: Internal Server Error

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header

definitions:
  User:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
      firstName:
        type: string
        description: user first name
      lastName:
        type: string
        description: user last name
  Login:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
        description: HTTP status code
      message:
        type: string
        description: Response message
      body:
        $ref: '#/definitions/UserProfile'
  LoginResponse:
    type: object
    properties:
      token:
        type: string
  UserProfile:
    type: object
    properties:
      userId:
        type: string
        description: Unique identifier for the user
      firstName:
        type: string
        description: User's first name
      lastName:
        type: string
        description: User's last name
      email:
        type: string
        description: User's email address
      createdAt:
        type: string
        format: date-time
        description: Timestamp when the user was created
      updatedAt:
        type: string
        format: date-time
        description: Timestamp when the user was last updated
  AccountsResponse:
    type: object
    properties:
      status: 
        type: integer
      message:
        type: string
      accounts:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            balance:
              type: number
  TransactionsResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      transactions:
        type: array
        items:
          type: object
          properties:
            id: 
              type: string
            accountId:
              type: string
            date:
              type: string
            description:
              type: string
            amount:
              type: number
            balance: 
              type: number
            type:
              type: string
            category:
              type: string
            notes:
              type: string
  UpdateTransaction:
    type: object
    properties:
      category:
        type: string
        description: Updated transaction category (e.g., "Food", "Travel", "Entertainment")
      notes:
        type: string
        description: Updated notes or description of the transaction
  TransactionUpdateResponse:
    type: object
    properties:
      status:
        type: integer
        example: 200
      message:
        type: string
        example: "Transaction updated successfully"
      updatedTransaction:
        type: object
        properties:
          transactionId:
            type: string
          accountId:
            type: string
          category:
            type: string
          notes:
            type: string
